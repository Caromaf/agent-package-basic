schema_version: 1.1
name: mise-tasks-usage-optional-flag
expected_outcome: >-
  prompt.md に記載したファイルを初期状態として、エージェントは #USAGE フラグを使った読み取り専用 CSV プレビュータスクを作成する。set -u のもとで、値が省略または空の場合に、文書化された usage_<name> 変数と明示的な :- フォールバックを使って安全に処理し、選択したパスを引用符で囲み、ヘッダーを除いたデータ行数を数える。既定の入力ではユーザー2人、別ファイルでは1人と表示する。データベースやネットワークには接続せず、ファイルを変更しない。関連する確認方法を説明する。
