# このリポ自体が Python パッケージとして配布・インストールされることはない ([build-system] は無い)。
# [project] は「配布物の宣言」ではなく、ty / ruff といった開発ツールが `.venv` を
# 通して型解決・依存解決できるようにするためだけに存在する。
#
# packages/*/.apm/skills/*/scripts/*.py と scripts/*.py は、この pyproject.toml とは
# 無関係に uv inline script (PEP 723) として自己完結で配布・実行される。
# 特に packages/ 配下のスクリプトは APM 経由で consumer のマシンへ単体コピーされ、
# この repo の pyproject.toml も .venv も存在しない環境で動くため、依存は
# 各スクリプト自身の `# /// script` ブロックに閉じておく必要がある。
#
# [dependency-groups] の PyYAML / ty は、上記スクリプトの依存をここへ集約するものではない。
# `mise run lint` の ty check は `uv run ty check` (この .venv 経由) で実行する必要があり、
# そのために ty 本体と、ty が各スクリプトの `import yaml` を型解決するための PyYAML を
# .venv に入れている。`uvx ty check` (ty 自身の隔離ツール環境) では .venv が見えず
# yaml が unresolved-import になる。ruff は import 解決が不要なので `uvx ruff` のままでよく、
# dependency-groups に含めない。
[project]
name = "agent-package-basic"
version = "0.0.0"
requires-python = ">=3.14"
readme = "README.md"

[dependency-groups]
dev = ["PyYAML>=6.0.2,<7", "ty"]

[tool.ruff]
target-version = "py314"
extend-exclude = [".apm-cache", ".rumdl_cache"]
# このリポは markdown 等で行長無制限を方針にしている (CLAUDE.md / .rumdl.toml 参照)。
# Python も同方針で揃えるため E501 を無効化。意味の通る 1 行で書く。
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing comma — `ruff format` と競合するため公式に推奨される無効化
  "CPY001", # copyright notice — 配布物に著作権ヘッダーを付ける運用にしていないため無効化
]

[tool.ruff.lint.per-file-ignores]
"{packages,scripts}/*" = [
  "T201", # print の利用を許可
  "D103", # パッケージ内のスクリプトは docstring を必須としない
  "D203", # D211 と競合するため無効化
  "D213", # D212 と競合するため無効化
  "D403", # 1 単語目を大文字にする規則（日本語 docstring と相性が悪い）
  "D415", # first line should end with a period（日本語のコメントを書くときに困るので無効化）
  "RUF002", # Allow ambiguous characters in docstrings (Japanese)
  "RUF003", # Allow ambiguous characters in comments (Japanese)
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["packages", "scripts"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"
